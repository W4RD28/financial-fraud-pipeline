server:
  port: ${ENGINE_SERVICE_PORT:8083}

spring:
  application:
    name: fraud-detection-engine

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  threads:
    virtual:
      enabled: true

  # Kafka Streams Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    streams:
      application-id: ${KAFKA_STREAMS_APP_ID:fraud-detection-engine-group}
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerdeClass
        default.value.serde: org.springframework.kafka.support.serializer.JsonSerde
        processing.guarantee: exactly_once_v2
        state.dir: /tmp/kafka-streams

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}

app:
  kafka:
    topics:
      raw-transactions: ${KAFKA_TOPIC_RAW:raw-transactions}
      fraud-alerts: ${KAFKA_TOPIC_ALERTS:fraud-alerts}
