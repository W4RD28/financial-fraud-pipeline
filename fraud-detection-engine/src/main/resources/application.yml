server:
  port: ${ENGINE_SERVICE_PORT:8083}

spring:
  application:
    name: fraud-detection-engine

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  threads:
    virtual:
      enabled: true

  # Kafka Streams Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    streams:
      application-id: ${KAFKA_STREAMS_APP_ID:fraud-detection-engine-streams}
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.springframework.kafka.support.serializer.JacksonJsonSerde
        commit.interval.ms: 1000
        processing.guarantee: exactly_once_v2
        replication.factor: 1
        transaction.state.log.replication.factor: 1
        transaction.state.log.min.isr: 1
        state.dir: /tmp/kafka-streams/fraud-detection-engine

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}

app:
  kafka:
    topics:
      raw-transactions: ${KAFKA_TOPIC_RAW:raw-transactions}
      fraud-alerts: ${KAFKA_TOPIC_ALERTS:fraud-alerts}
  fraud:
    velocity-window-seconds: 60
    max-transactions-per-window: 3
    high-value-threshold: 5000.00
