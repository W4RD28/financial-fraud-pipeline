services:
  transaction-gateway-service:
    build:
      context: .
      dockerfile: transaction-gateway-service/Dockerfile
    container_name: transaction-gateway-service
    ports:
      - "${GATEWAY_SERVICE_PORT}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:${KAFKA_INTERNAL_PORT}
    networks:
      - fraud-network

  fraud-detection-engine:
    build:
      context: .
      dockerfile: fraud-detection-engine/Dockerfile
    container_name: fraud-detection-engine
    ports:
      - "${ENGINE_SERVICE_PORT}:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:${KAFKA_INTERNAL_PORT}
    networks:
      - fraud-network

  fraud-audit-service:
    build:
      context: .
      dockerfile: fraud-audit-service/Dockerfile
    container_name: fraud-audit-service
    ports:
      - "${AUDIT_SERVICE_PORT}:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:${KAFKA_INTERNAL_PORT}
    networks:
      - fraud-network

networks:
  fraud-network:
    external: true
