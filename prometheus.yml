global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "spring-microservices"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "api-gateway:8080"
          - "transaction-gateway-service:8081"
          - "fraud-audit-service:8082"
          - "fraud-detection-engine:8083"
