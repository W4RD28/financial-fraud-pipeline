server:
  port: ${AUDIT_SERVICE_PORT:8082}
  forward-headers-strategy: framework

spring:
  application:
    name: fraud-audit-service

  data:
    web:
      pageable:
        one-indexed-parameters: true

  threads:
    virtual:
      enabled: true

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fraud_db}?currentSchema=audit
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: audit

  flyway:
    enabled: true
    schemas: audit
    default-schema: audit
    create-schemas: true
    locations: classpath:db/migration

  # Kafka Consumer Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:fraud-audit-group}
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: "com.fraud.common.dto"
        spring.json.value.default.type: com.fraud.common.dto.event.FraudAlertEvent
    listener:
      ack-mode: RECORD
      concurrency: 3

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}

app:
  kafka:
    topics:
      fraud-alerts: ${KAFKA_TOPIC_ALERTS:fraud-alerts}
